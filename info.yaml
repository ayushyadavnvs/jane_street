# Tiny Tapeout project information
project:
  title:        "Programmable Bit Engine"      # Project title
  author:       "Ayush Yadav"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Two programmable engines that run protocol programs: UART, SPI, I2C, 1-Wire, Modbus RTU, WS2812, USB low speed"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     48000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ayushyadavnvs_pbe"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "pbe_fifo.sv"
    - "pbe_host_spi.sv"
    - "pbe_crc.sv"
    - "pbe_line.sv"
    - "pbe_engine.sv"
    - "tt_um_pbe.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "host SCK"
  ui[1]: "host CS_n"
  ui[2]: "host MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "host MISO"
  uo[1]: "IRQ"
  uo[2]: "engine 0 running"
  uo[3]: "engine 1 running"
  uo[4]: "engine 0 RX data"
  uo[5]: "engine 1 RX data"
  uo[6]: "engine 0 TX full"
  uo[7]: "engine 1 TX full"

  # Bidirectional pins
  uio[0]: "protocol pin 0"
  uio[1]: "protocol pin 1"
  uio[2]: "protocol pin 2"
  uio[3]: "protocol pin 3"
  uio[4]: "protocol pin 4"
  uio[5]: "protocol pin 5"
  uio[6]: "protocol pin 6"
  uio[7]: "protocol pin 7"

# Do not change!
yaml_version: 6
