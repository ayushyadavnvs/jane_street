name: gds

on:
  push:
    # The flow takes about 4 hours: run it only when the design or its tests change.
    paths:
      - 'src/**'
      - 'info.yaml'
      - 'test/**'
      - 'pbe_v1/test/**'
      - 'pbe_v1/programs/**'
      - 'pbe_v1/Makefile'
      - '.github/workflows/gds.yaml'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l # or ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a

  # The design's full end-to-end testbenches (pbe_v1/test: every protocol, USB enumeration) on
  # the routed netlist, not only the small cocotb test that gl_test runs.
  gl_regression:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      # Into the workspace root, as gl_test does: the artifact holds its own tt_submission/
      # folder (a `path: tt_submission` here nests it one level too deep: BUG-036).
      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Read the PDK version
        working-directory: tt_submission
        run: |
          set -euo pipefail
          PDK=$(jq -er '.PDK' pdk.json)
          PDK_VERSION=$(jq -er '.PDK_VERSION' pdk.json)
          echo "PDK=$PDK" >> $GITHUB_ENV
          echo "PDK_VERSION=$PDK_VERSION" >> $GITHUB_ENV
          echo "PDK_ROOT=/home/runner/pdk" >> $GITHUB_ENV

      - name: Install the PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run the testbenches on the gate-level netlist
        run: |
          NETLIST=$(ls $GITHUB_WORKSPACE/tt_submission/*.v | head -1)
          cd pbe_v1 && make test-gl GL_NETLIST="$NETLIST"

