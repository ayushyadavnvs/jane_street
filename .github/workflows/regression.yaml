name: regression
# The design's own test suite (pbe_v1/Makefile): unit tests and the end-to-end testbenches
# through the chip's pins. `make test` exits non-zero on any failure.
on: [push, workflow_dispatch]
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install iverilog, verilator and yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Lint (Verilator, all warnings)
        run: |
          cd src
          # the default build: the SRAM program memory (D82), the macro as a black box (sram_bb.v)
          verilator --lint-only -Wall -Wno-DECLFILENAME --top-module tt_um_ayushyadavnvs_pbe \
            pbe_fifo.sv pbe_host_spi.sv pbe_crc.sv pbe_line.sv pbe_bsync.sv pbe_engine.sv pbe_pmem_sram.sv tt_um_pbe.sv sram_bb.v
          # the flip-flop fallback (PBE_PMEM_FF, D82)
          verilator --lint-only -Wall -Wno-DECLFILENAME --top-module tt_um_ayushyadavnvs_pbe -DPBE_PMEM_FF \
            pbe_fifo.sv pbe_host_spi.sv pbe_crc.sv pbe_line.sv pbe_bsync.sv pbe_engine.sv tt_um_pbe.sv
      - name: Testbenches under Verilator and Icarus, identical logs (race check, BUG-102)
        run: cd pbe_v1 && make test-verilator
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r verify/golden-model/differential/requirements.txt
      - name: Run the test suite
        run: cd pbe_v1 && make test
